<!doctype html>
<html lang="en" data-resolution="custom">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Marcellus";
        src: url("assets/marcellus.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Figtree";
        src: url("assets/figtree.woff2") format("woff2");
        font-weight: 300 900;
        font-style: normal;
        font-display: block;
      }
      :root {
        --ink: #121212;
        --paper: #ffffff;
        --muted: #5f5b56;
        --accent: #6a1e2b;
        --display: "Marcellus", "Times New Roman", serif;
        --ui: "Figtree", system-ui, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
      }
      .frame-full {
        position: absolute;
        inset: 0;
      }
      #photo {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 50%;
      }
      #band {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 340px;
      }
      #band-inner {
        position: absolute;
        inset: 0;
        background: var(--paper);
        padding: 60px 64px;
      }
      #band-rule {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 0;
        height: 3px;
        background: var(--accent);
        transform-origin: 0% 50%;
      }
      #band-title {
        font: 600 28px/1 var(--ui);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #cats {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 18px 40px;
        margin-top: 36px;
      }
      #cats li {
        font-family: var(--display);
        font-size: 46px;
        line-height: 1.05;
        color: var(--ink);
      }
      #wipe-inner {
        position: absolute;
        inset: 0;
        background: var(--ink);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="hero-motion"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1350"
    >
      <div id="photo-frame" class="clip frame-full" data-start="0" data-duration="6" data-track-index="0">
        <img id="photo" src="assets/hero-yellow-puffer.jpg" alt="" />
      </div>

      <div id="band" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="band-inner" data-layout-allow-overflow>
          <div id="band-rule"></div>
          <p id="band-title">Shop by category</p>
          <ul id="cats">
            <li>Long sleeve</li>
            <li>Sleeveless</li>
            <li>Short sleeve</li>
            <li>Caps and hats</li>
            <li>Accessories</li>
          </ul>
        </div>
      </div>

      <div id="wipe" class="clip frame-full" data-start="0" data-duration="6" data-track-index="2">
        <div id="wipe-inner" data-layout-allow-overflow></div>
      </div>
    </div>

    <script>
      // The piece opens and closes on a full ink frame, so the video loops
      // without a visible seam. Every value is fixed: no randomness, no clocks.
      const tl = gsap.timeline({ paused: true });

      // Photograph settles slowly across the whole piece.
      tl.fromTo("#photo", { scale: 1.12 }, { scale: 1, duration: 6, ease: "none" }, 0);

      // Ink wipe clears the photograph from left to right.
      tl.fromTo("#wipe-inner", { xPercent: 0 }, { xPercent: 100, duration: 0.7, ease: "power3.inOut" }, 0.5);

      // Category band rises, its accent rule draws, then the categories arrive in turn.
      tl.fromTo("#band-inner", { yPercent: 100 }, { yPercent: 0, duration: 0.8, ease: "expo.out" }, 1.0);
      tl.fromTo("#band-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 1.2);
      tl.fromTo("#band-title", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.4);
      tl.fromTo(
        "#cats li",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.22 },
        1.6,
      );

      // Hold, then the band and the categories leave.
      tl.to("#cats li, #band-title", { opacity: 0, duration: 0.35, ease: "power2.in" }, 4.9);
      tl.fromTo("#band-inner", { yPercent: 0 }, { yPercent: 100, duration: 0.5, ease: "expo.in", immediateRender: false }, 5.2);

      // The ink wipe returns to cover the frame again, closing the loop.
      tl.fromTo("#wipe-inner", { xPercent: -100 }, { xPercent: 0, duration: 0.6, ease: "power3.inOut", immediateRender: false }, 5.4);

      window.__timelines["hero-motion"] = tl;
    </script>
  </body>
</html>
